<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Login Page -->
        <div id="login-page" class="page">
            <h1>Login</h1>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="#" id="show-register">Register</a></p>
        </div>

        <!-- Register Page -->
        <div id="register-page" class="page" style="display: none;">
            <h1>Register</h1>
            <form id="register-form">
                <input type="email" id="register-email" placeholder="Email" required>
                <input type="password" id="register-password" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="#" id="show-login">Login</a></p>
        </div>

	<!-- Message View Page -->
        <div id="message-view-page" class="page" style="display: none;">
            <h1>Messages</h1>
            <button id="compose-button">Compose</button>
	    <!--<div id="email-table"></div>//-->
            <div id="email-controls">
                <input type="text" id="email-filter" placeholder="Filter emails...">
            </div>
            <div id="email-table-container">
              <div id="email-pagination-top"></div>
              <div id="email-table"></div>
              <div id="email-pagination"></div>
            </div>
            <div id="message-list"></div>
            <button id="logout-button">Logout</button>
        </div>

        <!-- Message Display Page -->
        <div id="message-display-page" class="page" style="display: none;">
            <h1>Message</h1>
            <button id="back-to-messages-top">Back to Messages</button>
            <div id="message-content"></div>
            <div class="email-actions">
                <!--

                //-->
                <button id="back-to-messages">Back to Messages</button>
            </div>
        </div>

	<!-- Send Message Page -->
        <div id="send-message-page" class="page" style="display: none;">
            <h1 id="send-message-title">New Message</h1>
            <form id="send-message-form">
                <input type="email" id="send-to" placeholder="To" required>
                <input type="text" id="send-subject" placeholder="Subject" required>
                <textarea id="send-body" placeholder="Message body..." required></textarea>
                <input type="file" id="send-attachments" multiple>
                <div id="email-quote" style="display: none; border-left: 3px solid #ccc; padding-left: 10px; margin: 10px 0;"></div>
                <div class="email-actions">
                    <button type="submit">Send</button>
                    <button type="button" id="cancel-send">Cancel</button>
                </div>
            </form>
        </div>

        <div id="reply-message-page" class="page" style="display: none;">
            <h1 id="reply-message-title">Reply to Message</h1>
            <form id="reply-message-form">
                <input type="email" id="reply-to" placeholder="To" required>
                <input type="text" id="reply-subject" placeholder="Subject" required>
                <textarea id="reply-body" placeholder="Message body..." required></textarea>
                <input type="file" id="reply-attachments" multiple>
                <div id="email-quote" style="display: none; border-left: 3px solid #ccc; padding-left: 10px; margin: 10px 0;"></div>
                <div class="email-actions">
                    <button type="submit">Send Reply</button>
                    <button type="button" id="cancel-reply">Cancel</button>
                </div>
            </form>
        </div>

        <div id="forward-message-page" class="page" style="display: none;">
            <h1 id="forward-message-title">Forward Message</h1>
            <form id="forward-message-form">
                <input type="email" id="forward-to" placeholder="To" required>
                <input type="text" id="forward-subject" placeholder="Subject" required>
                <textarea id="forward-body" placeholder="Message body..." required></textarea>
                <input type="file" id="forward-attachments" multiple>
                <div id="email-quote" style="display: none; border-left: 3px solid #ccc; padding-left: 10px; margin: 10px 0;"></div>
                <div class="email-actions">
                    <button type="submit">Send Forward</button>
                    <button type="button" id="cancel-forward">Cancel</button>
                </div>
            </form>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
