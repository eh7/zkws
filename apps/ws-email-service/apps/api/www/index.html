<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Login Page -->
        <div id="login-page" class="page">
            <h1>Login</h1>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p>Don't have an account? <a href="#" id="show-register">Register</a></p>
        </div>

        <!-- Register Page -->
        <div id="register-page" class="page" style="display: none;">
            <h1>Register</h1>
            <form id="register-form">
                <input type="email" id="register-email" placeholder="Email" required>
                <input type="password" id="register-password" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
            <p>Already have an account? <a href="#" id="show-login">Login</a></p>
        </div>

        <!-- Message View Page -->
        <div id="message-view-page" class="page" style="display: none;">
            <h1>Messages</h1>
            <div id="message-list"></div>
            <button id="logout-button">Logout</button>
        </div>

        <!-- Message Display Page -->
        <div id="message-display-page" class="page" style="display: none;">
            <h1>Message</h1>
            <div id="message-content"></div>
            <button id="back-to-messages">Back to Messages</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
