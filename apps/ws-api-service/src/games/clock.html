<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analogue Clock with Numbers</title>
    <style>
        #clock {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            border-radius: 50%;
            position: relative;
            margin: 20px auto;
        }
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: 50% 100%;
            background-color: black;
        }
        #hour {
            width: 6px;
            height: 60px;
            margin-left: -3px;
        }
        #minute {
            width: 4px;
            height: 80px;
            margin-left: -2px;
        }
        #second {
            width: 2px;
            height: 90px;
            margin-left: -1px;
            background-color: red;
        }
        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
        }
        .number span {
            display: inline-block;
            position: absolute;
        }
    </style>
</head>
<body>
    <div id="clock">
        <div class="number" id="numbers">
            <span style="transform: rotate(30deg) translateY(-90px);">1</span>
            <span style="transform: rotate(60deg) translateY(-90px);">2</span>
            <span style="transform: rotate(90deg) translateY(-90px);">3</span>
            <span style="transform: rotate(120deg) translateY(-90px);">4</span>
            <span style="transform: rotate(150deg) translateY(-90px);">5</span>
            <span style="transform: rotate(180deg) translateY(-90px);">6</span>
            <span style="transform: rotate(210deg) translateY(-90px);">7</span>
            <span style="transform: rotate(240deg) translateY(-90px);">8</span>
            <span style="transform: rotate(270deg) translateY(-90px);">9</span>
            <span style="transform: rotate(300deg) translateY(-90px);">10</span>
            <span style="transform: rotate(330deg) translateY(-90px);">11</span>
            <span style="transform: rotate(0deg) translateY(-90px);">12</span>
        </div>
        <div id="hour" class="hand"></div>
        <div id="minute" class="hand"></div>
        <div id="second" class="hand"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = now.getHours() % 12;
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            const hourDegrees = (hours * 30) + (minutes * 0.5);
            const minuteDegrees = minutes * 6;
            const secondDegrees = seconds * 6;

            document.getElementById('hour').style.transform = `rotate(${hourDegrees}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minuteDegrees}deg)`;
            document.getElementById('second').style.transform = `rotate(${secondDegrees}deg)`;
        }

        setInterval(updateClock, 1000);
        updateClock(); // Initialize the clock immediately
    </script>
</body>
</html>
